<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Digital Capsule</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        .playful-font { font-family: 'Fredoka', cursive, sans-serif; }
        .handwriting-font { font-family: 'Great Vibes', cursive; font-size: 2.5rem; line-height: 1.4; }
    </style>
</head>
<body class="bg-[#FFF0F5] text-zinc-700 min-h-screen flex flex-col items-center justify-center p-6 select-none">

    <!-- CREATOR WIZARD VIEW -->
    <div id="creator-view" class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
        
        <!-- LEFT COLUMN: Interactive Cards -->
        <div class="flex flex-col gap-6">
            
            <!-- STEP 1: BUDDY SELECTOR -->
            <div id="step-buddy" class="step-card bg-white/80 border-4 border-pink-200 p-8 rounded-[2.5rem] shadow-xl flex flex-col gap-4">
                <h2 class="playful-font text-2xl text-pink-500 font-bold tracking-wide text-center">Pick your Pixel buddy !</h2>
                <div class="flex items-center justify-between px-4">
                    <button onclick="changeBuddy(-1)" class="text-pink-400 hover:text-pink-600 font-bold text-4xl px-3 cursor-pointer transition transform hover:scale-125">&lt;</button>
                    <div class="h-40 flex items-center justify-center p-2">
                        <img id="preview-buddy-img" src="assets/buddy1.png" class="w-28 h-28 object-contain drop-shadow-md">
                    </div>
                    <button onclick="changeBuddy(1)" class="text-pink-400 hover:text-pink-600 font-bold text-4xl px-3 cursor-pointer transition transform hover:scale-125">&gt;</button>
                </div>
            </div>

            <!-- STEP 2: FLOWER SELECTOR -->
            <div id="step-flower" class="step-card hidden bg-white/80 border-4 border-purple-200 p-8 rounded-[2.5rem] shadow-xl flex flex-col gap-4">
                <h2 class="playful-font text-2xl text-purple-500 font-bold tracking-wide text-center">Pick your flower !</h2>
                <div class="flex items-center justify-between px-4">
                    <button onclick="changeFlower(-1)" class="text-purple-400 hover:text-purple-600 font-bold text-4xl px-3 cursor-pointer transition transform hover:scale-125">&lt;</button>
                    <div class="h-48 flex items-center justify-center p-2">
                        <img id="preview-flower-img" src="assets/flower1.png" class="w-44 h-44 object-contain drop-shadow-md">
                    </div>
                    <button onclick="changeFlower(1)" class="text-purple-400 hover:text-purple-600 font-bold text-4xl px-3 cursor-pointer transition transform hover:scale-125">&gt;</button>
                </div>
            </div>

            <!-- STEP 3: SONG SELECTOR -->
            <div id="step-song" class="step-card hidden bg-white/80 border-4 border-emerald-200 p-8 rounded-[2.5rem] shadow-xl flex flex-col gap-4">
                <h2 class="playful-font text-2xl text-emerald-600 font-bold tracking-wide text-center">Pick your song !</h2>
                <div class="flex items-center gap-4 px-2">
                    <div class="text-4xl shrink-0">🎵</div>
                    <input type="text" id="input-spotify" placeholder="Paste Spotify track link..." class="w-full bg-emerald-50/50 border-2 border-emerald-200 p-4 rounded-2xl text-base text-zinc-700 playful-font focus:outline-none focus:border-emerald-400">
                </div>
            </div>

            <!-- STEP 4: NOTE WRITER -->
            <div id="step-note" class="step-card hidden bg-white/80 border-4 border-amber-200 p-8 rounded-[2.5rem] shadow-xl flex flex-col gap-4">
                <h2 class="playful-font text-2xl text-amber-600 font-bold tracking-wide text-center">Write a note !</h2>
                <div class="px-2">
                    <textarea id="input-note" placeholder="Write text here..." class="w-full bg-amber-50/60 border-2 border-amber-200 p-5 rounded-3xl text-3xl text-amber-900 handwriting-font focus:outline-none focus:border-amber-400 h-40 resize-none shadow-inner"></textarea>
                </div>
            </div>

            <!-- Wizard Navigation Button -->
            <button id="next-btn" onclick="nextStep()" class="w-full py-5 bg-pink-400 hover:bg-pink-500 text-white playful-font text-lg font-bold rounded-3xl shadow-lg cursor-pointer transition transform hover:scale-[1.02]">
                Next Step ➔
            </button>
            
            <!-- Output Link Box with Copy Button -->
            <div id="link-output-box" class="hidden flex flex-col gap-3 p-6 bg-white border-4 border-pink-200 rounded-[2.5rem] shadow-xl">
                <span class="text-sm text-pink-500 playful-font font-bold">Your link is ready! Copy and share:</span>
                <div class="flex items-center gap-2">
                    <input type="text" id="generated-link" readonly class="w-full bg-pink-50 border-2 border-pink-100 p-4 rounded-2xl text-xs text-pink-600 select-all font-mono">
                    <button onclick="copyLink()" class="bg-pink-400 hover:bg-pink-500 text-white playful-font font-bold px-5 py-4 rounded-2xl text-sm transition shadow cursor-pointer whitespace-nowrap">
                        Copy 📋
                    </button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: The Capsule Preview Box -->
        <div class="bg-white/80 border-4 border-pink-200 p-12 rounded-[3rem] flex flex-col items-center justify-center gap-6 text-center shadow-2xl h-full min-h-[500px]">
            <div class="relative flex items-center justify-center my-6">
                <img src="assets/capsule2.png" class="w-60 h-60 object-contain drop-shadow-xl">
                <div class="absolute flex items-center gap-4">
                    <img id="capsule-buddy-preview" src="assets/buddy1.png" class="w-24 h-24 object-contain drop-shadow-md">
                    <img id="capsule-flower-preview" src="assets/flower1.png" class="w-48 h-48 object-contain drop-shadow-md">
                </div>
            </div>
            <p id="capsule-status-text" class="text-pink-400 handwriting-font text-3xl">Packing items into your capsule...</p>
        </div>
    </div>


    <!-- VIEW 2: RECEIVER - PIC 1 FORMAT (Click capsule1 to open) -->
    <div id="receiver-view-1" class="hidden flex flex-col items-center gap-8 max-w-lg w-full text-center">
        <h1 class="playful-font text-4xl text-pink-500 font-bold drop-shadow-sm">Open your capsule!</h1>
        
        <div onclick="openReceiverCapsule()" class="cursor-pointer transition transform hover:scale-105 active:scale-95 p-6">
            <img src="assets/capsule1.png" class="w-72 h-72 object-contain drop-shadow-2xl animate-pulse">
        </div>
        
        <p class="text-pink-400 playful-font text-xl font-medium">Tap the capsule to break the seal 🗝️</p>
    </div>


    <!-- VIEW 3: RECEIVER - PIC 2 FORMAT (Opened contents layout with Embedded Spotify Player) -->
    <div id="receiver-view-2" class="hidden w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-10 items-center p-4">
        
        <!-- Left: Capsule 2 -->
        <div class="flex flex-col items-center justify-center">
            <img src="assets/capsule2.png" class="w-80 h-80 object-contain drop-shadow-2xl">
        </div>

        <!-- Right: Floating Elements & Embedded Spotify Player -->
        <div class="flex flex-col gap-6 items-center justify-center">
            
            <!-- Buddy -->
            <div class="flex items-center justify-center">
                <img id="display-buddy" src="" class="w-32 h-32 object-contain drop-shadow-md">
            </div>

            <!-- Flower (Massive) -->
            <div class="flex items-center justify-center">
                <img id="display-flower" src="" class="w-56 h-56 object-contain drop-shadow-md">
            </div>

            <!-- Note Card with Romantic Font -->
            <div class="w-full bg-amber-50/90 border-4 border-amber-200 p-8 rounded-[2.5rem] shadow-lg flex flex-col gap-2">
                <p id="display-note" class="text-amber-900 handwriting-font whitespace-pre-wrap leading-relaxed text-center">...</p>
            </div>

            <!-- Embedded Spotify Player Container -->
            <div id="spotify-player-container" class="hidden w-full rounded-[2rem] overflow-hidden shadow-lg border-4 border-emerald-200 bg-white">
                <iframe id="spotify-iframe" style="border-radius:12px" src="" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>

            <button onclick="resetToCreator()" class="mt-2 text-center text-sm text-pink-400 hover:text-pink-600 playful-font font-bold underline cursor-pointer">
                Create your own capsule ✨
            </button>
        </div>
    </div>

    <script>
        const buddies = ['assets/buddy1.png', 'assets/buddy2.png', 'assets/buddy3.png', 'assets/buddy4.png', 'assets/buddy5.png'];
        const flowers = ['assets/flower1.png', 'assets/flower2.png', 'assets/flower3.png', 'assets/flower4.png', 'assets/flower5.png'];

        let currentBuddyIdx = 0;
        let currentFlowerIdx = 0;
        let currentStep = 1;

        function changeBuddy(dir) {
            currentBuddyIdx = (currentBuddyIdx + dir + buddies.length) % buddies.length;
            const path = buddies[currentBuddyIdx];
            document.getElementById('preview-buddy-img').src = path;
            document.getElementById('capsule-buddy-preview').src = path;
        }

        function changeFlower(dir) {
            currentFlowerIdx = (currentFlowerIdx + dir + flowers.length) % flowers.length;
            const path = flowers[currentFlowerIdx];
            document.getElementById('preview-flower-img').src = path;
            document.getElementById('capsule-flower-preview').src = path;
        }

        function nextStep() {
            if (currentStep === 1) {
                document.getElementById('step-buddy').classList.add('hidden');
                document.getElementById('step-flower').classList.remove('hidden');
                currentStep = 2;
            } else if (currentStep === 2) {
                document.getElementById('step-flower').classList.add('hidden');
                document.getElementById('step-song').classList.remove('hidden');
                currentStep = 3;
            } else if (currentStep === 3) {
                document.getElementById('step-song').classList.add('hidden');
                document.getElementById('step-note').classList.remove('hidden');
                document.getElementById('next-btn').innerText = "Seal Capsule & Get Link 🔒";
                currentStep = 4;
            } else if (currentStep === 4) {
                generateLink();
            }
        }

        function generateLink() {
            const note = document.getElementById('input-note').value.trim();
            const spotifyUrl = document.getElementById('input-spotify').value.trim();

            if (!note) {
                alert("Please write a note first!");
                return;
            }

            const payload = {
                b: buddies[currentBuddyIdx],
                f: flowers[currentFlowerIdx],
                n: note,
                s: spotifyUrl || null
            };

            const encodedData = btoa(encodeURIComponent(JSON.stringify(payload)));
            const shareableLink = window.location.origin + window.location.pathname + "?data=" + encodedData;

            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('step-note').classList.add('hidden');
            document.getElementById('link-output-box').classList.remove('hidden');
            document.getElementById('generated-link').value = shareableLink;
        }

        function copyLink() {
            const linkInput = document.getElementById('generated-link');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(linkInput.value);
            alert("Link copied to clipboard! ✨");
        }

        function openReceiverCapsule() {
            document.getElementById('receiver-view-1').classList.add('hidden');
            document.getElementById('receiver-view-2').classList.remove('hidden');
        }

        function resetToCreator() {
            window.location.href = window.location.pathname;
        }

        // Helper to convert standard Spotify track links to clean embed URLs
        function getSpotifyEmbedUrl(url) {
            try {
                if (!url.includes('spotify.com')) return null;
                // Matches track links like https://open.spotify.com/track/4iV5W9uYEdYUVa79Axb7Rh?...
                const match = url.match(/track\/([a-zA-Z0-9]+)/);
                if (match && match[1]) {
                    return `https://open.spotify.com/embed/track/${match[1]}?utm_source=generator&theme=0`;
                }
            } catch (e) {
                console.error("Error parsing spotify URL", e);
            }
            return null;
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');

            if (dataParam) {
                try {
                    const decodedPayload = JSON.parse(decodeURIComponent(atob(dataParam)));
                    
                    document.getElementById('display-buddy').src = decodedPayload.b || buddies[0];
                    document.getElementById('display-flower').src = decodedPayload.f || flowers[0];
                    document.getElementById('display-note').innerText = decodedPayload.n || "";

                    if (decodedPayload.s) {
                        const embedUrl = getSpotifyEmbedUrl(decodedPayload.s);
                        if (embedUrl) {
                            document.getElementById('spotify-iframe').src = embedUrl;
                            document.getElementById('spotify-player-container').classList.remove('hidden');
                        }
                    }

                    document.getElementById('creator-view').classList.add('hidden');
                    document.getElementById('receiver-view-1').classList.remove('hidden');
                } catch (e) {
                    console.error("Invalid link data");
                }
            }
        };
    </script>
</body>
</html>
